name: CI

# Push-time anti-phantom safety net. Gates are named honestly: a green
# "Fast checks" means typecheck + lint + unit passed — NOT that the platform
# works. "Build" proves the bundle compiles. Heavier honest gates
# (check:content, e2e, render, workflow) run in their own steps/jobs.
# See .planning/PROJECT-PLAN-2026-05-23.md §7 and .planning/AUDIT-IMPROVEMENTS-2026-05-27.md P0.1.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  check:
    name: ${{ matrix.name }} — check + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            dir: .
          - name: chatbot
            dir: chatbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      # `npm install` (not `npm ci`): the project's lockfiles are intentionally
      # tolerant of npm-version differences across environments.
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install

      - name: Fast checks (typecheck + lint + unit)
        working-directory: ${{ matrix.dir }}
        run: npm run check:fast

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build
