services:
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ACCESS_CODE=${ACCESS_CODE:?ACCESS_CODE must be set — no default; see chatbot/.env.example}
      # Free 'mock' default (valid value; no key, no spend). 'anthropic' requires a
      # key. Unknown values fail closed at startup (see chatbot/src/lib/config.ts).
      # The free 'claude-code' provider (#63) needs the claude CLI + an authed session,
      # which live on the host (npm run dev), not in this image — so the container
      # default stays 'mock'.
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - DEMO_MODULE_SCOPE=${DEMO_MODULE_SCOPE:-module-1}
      - NEXT_PUBLIC_DEV_BYPASS=${NEXT_PUBLIC_DEV_BYPASS:-false}
      # Operator/write-route auth (#60). Empty default = deny-by-default (operator
      # routes return 401). Set OPERATOR_TOKEN to enable them in a deployed container.
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - SESSION_DATA_DIR=/app/data/sessions
    # Persist chat sessions across container restarts (CHAT-05).
    volumes:
      - chatbot-data:/app/data
    restart: unless-stopped

volumes:
  chatbot-data:
