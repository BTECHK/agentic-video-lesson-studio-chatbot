services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - NODE_ENV=development

  render:
    build:
      context: .
      dockerfile: docker/Dockerfile.render
    volumes:
      - ./output:/app/output
      # Per-lesson regen render (#47): mount the live content (edited script +
      # injected .render-props.json), the mp4 output dir, and the composition
      # source so `docker compose run --rm render …` reflects the current lesson.
      - ./content:/app/content
      - ./out:/app/out
      - ./src:/app/src
    shm_size: '2gb'
    environment:
      - NODE_ENV=production
    command: npx tsx scripts/pipeline.ts --skip-determinism

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    volumes:
      - ./content:/app/content
      - ./scripts:/app/scripts
      - ./ingest.config.json:/app/ingest.config.json
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production

  # Free/local, commercial-safe TTS sidecar (Kokoro-82M, Apache-2.0).
  # Models download on first run and persist in the tts-models volume.
  tts:
    build:
      context: .
      dockerfile: docker/Dockerfile.tts
    volumes:
      - ./content:/app/content
      - tts-models:/root/.cache/huggingface
    environment:
      - NODE_ENV=production
      - GOOGLE_VOICE_API_KEY=${GOOGLE_VOICE_API_KEY}
      - TTS_PAID_API_KEY=${TTS_PAID_API_KEY}
      - GOOGLE_VOICE_DAILY_LIMIT=${GOOGLE_VOICE_DAILY_LIMIT:-150}

volumes:
  tts-models:
