<svg viewBox="0 0 800 770" xmlns="http://www.w3.org/2000/svg" font-family="'Syne', system-ui, sans-serif" role="img">
  <title>Lesson-to-video pipeline, top to bottom</title>
  <desc>Six stages: inputs, plan and build (parallel), audio (parallel), render (serial bottleneck, ~30 min each), check (auto gates plus Codex), deliver to Drive. A loop returns from check to render for v3 re-renders.</desc>
  <style>
    svg{--ink:#1C1C1C;--muted:#6B6B6B;--card:#FDFBF9;--band:#F2ECE5;--line:#C9C2B6;--crimson:#8B2635;}
    .nm{fill:var(--ink);font-weight:700;}
    .sub{fill:var(--muted);font-weight:500;}
    .tm{fill:var(--muted);font-weight:600;}
    .box{fill:var(--card);stroke:var(--line);stroke-width:1.5;}
    .ed{stroke:var(--ink);stroke-width:2;fill:none;}
    .loop{stroke:var(--crimson);stroke-width:2;fill:none;stroke-dasharray:6 5;}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1C1C1C"/></marker>
    <marker id="ahc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8B2635"/></marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" class="nm" font-size="22">How a lesson becomes a video</text>
  <text x="400" y="54" text-anchor="middle" class="sub" font-size="13">start → finish · read top to bottom</text>

  <rect class="box" x="230" y="78" width="340" height="50" rx="4"/>
  <text x="400" y="99" text-anchor="middle" class="nm" font-size="15">1 · INPUTS</text>
  <text x="400" y="117" text-anchor="middle" class="sub" font-size="12">what to teach + how it should look</text>
  <path class="ed" d="M400,128 L400,150" marker-end="url(#ah)"/>

  <rect class="box" x="230" y="152" width="340" height="56" rx="4"/>
  <text x="400" y="174" text-anchor="middle" class="nm" font-size="15">2 · PLAN + BUILD  <tspan class="tm" font-size="11">∥ parallel</tspan></text>
  <text x="400" y="194" text-anchor="middle" class="sub" font-size="12">Claude writes each lesson's data file</text>
  <text x="600" y="184" class="tm" font-size="11">~20–40 min</text>
  <path class="ed" d="M400,208 L400,230" marker-end="url(#ah)"/>

  <rect class="box" x="230" y="232" width="340" height="52" rx="4"/>
  <text x="400" y="253" text-anchor="middle" class="nm" font-size="15">3 · AUDIO  <tspan class="tm" font-size="11">∥ parallel</tspan></text>
  <text x="400" y="271" text-anchor="middle" class="sub" font-size="12">narration → voiceover (TTS)</text>
  <text x="600" y="262" class="tm" font-size="11">~3–8 min ea.</text>
  <path class="ed" d="M400,284 L400,306" marker-end="url(#ah)"/>

  <rect x="230" y="308" width="340" height="74" rx="4" fill="#F7E6E7" stroke="#8B2635" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-weight="700" font-size="15" fill="#8B2635">4 · RENDER  ◀ bottleneck</text>
  <text x="400" y="349" text-anchor="middle" class="sub" font-size="12">each lesson → MP4 · ONE at a time</text>
  <text x="400" y="369" text-anchor="middle" font-size="12" fill="#8B2635" font-weight="600">Lesson 1 ▸ Lesson 2 ▸ Lesson 3 ▸ …</text>
  <text x="600" y="338" font-size="11" fill="#8B2635" font-weight="700">~30 min each</text>
  <text x="600" y="354" font-size="11" fill="#8B2635">hours for the full set</text>
  <path class="ed" d="M400,382 L400,404" marker-end="url(#ah)"/>

  <rect class="box" x="230" y="406" width="340" height="62" rx="4"/>
  <text x="400" y="428" text-anchor="middle" class="nm" font-size="15">5 · CHECK</text>
  <text x="400" y="446" text-anchor="middle" class="sub" font-size="12">auto gates: A·B·C·L·T + motion/sound/color</text>
  <text x="400" y="462" text-anchor="middle" font-size="12" fill="#8B2635" font-weight="600">✦ then Codex (2nd AI) re-checks</text>
  <text x="600" y="441" class="tm" font-size="11">~2 min ea.</text>
  <path class="ed" d="M400,468 L400,490" marker-end="url(#ah)"/>

  <rect x="230" y="492" width="340" height="52" rx="4" fill="#1C1C1C" stroke="#1C1C1C"/>
  <text x="400" y="513" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="15">6 · DELIVER</text>
  <text x="400" y="531" text-anchor="middle" fill="#FFFFFF" font-size="12" opacity="0.85">to Drive: Video + Script + Lesson Plan</text>

  <path class="loop" d="M230,437 L150,437 L150,345 L230,345" marker-end="url(#ahc)"/>
  <text transform="rotate(-90 138 391)" x="138" y="391" text-anchor="middle" font-size="11" fill="#8B2635" font-weight="600">⟲ re-render (v3)</text>

  <rect x="40" y="572" width="720" height="168" rx="6" fill="#F2ECE5" stroke="#C9C2B6"/>
  <text x="58" y="596" class="nm" font-size="13">KEY</text>
  <text x="58" y="620" class="sub" font-size="12"><tspan font-weight="700" fill="#1C1C1C">Render</tspan> = a computer draws every video frame, then encodes an MP4 (~30 min/lesson).</text>
  <text x="58" y="642" class="sub" font-size="12"><tspan font-weight="700" fill="#1C1C1C">A·B·C·L·T</tspan> (the auto checks) = Accuracy · Teaching · Watchability · Layout · Timing.</text>
  <text x="58" y="664" class="sub" font-size="12"><tspan font-weight="700" fill="#1C1C1C">∥ Parallel</tspan> = many lessons at once.   <tspan font-weight="700" fill="#1C1C1C">▸ Serial</tspan> = one at a time (why render is the bottleneck).</text>
  <text x="58" y="686" class="sub" font-size="12"><tspan font-weight="700" fill="#8B2635">✦ Codex</tspan> = a 2nd, different AI that re-checks before publishing.</text>
  <text x="58" y="708" class="sub" font-size="12"><tspan font-weight="700" fill="#1C1C1C">v3</tspan> = this design-polish version of the videos (the loop re-renders the fixed lessons).</text>
  <text x="58" y="730" class="sub" font-size="12"><tspan font-weight="700" fill="#1C1C1C">lesson.json</tspan> = one file describing a lesson's scenes, text &amp; narration.</text>
</svg>
